<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="description" content="Cash accounting, rule-based deductions, daily closing and audit — works fully offline." />
<meta name="theme-color" content="#F4EFE6" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="CashBook" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<link rel="stylesheet" href="styles.css" />
<title>CashBook — Cash Accounting &amp; Expense Management</title>
</head>
<body>
<header class="topbar">
  <div class="brand"><span class="brand-mark">◧</span><div><p class="eyebrow">Cash accounting</p><h1>CashBook</h1></div></div>
  <div class="top-search"><input id="gSearch" placeholder="Search transactions — try “Insurance” or “500”…" autocomplete="off"><button onclick="globalSearch()" title="Search">⌕</button></div>
  <div class="top-right"><span id="bizBadge" class="pill"></span><span class="pill"><span id="netDot" class="netdot"></span><span id="netTxt">offline</span></span></div>
</header>
<nav id="topTabs" class="tabs" aria-label="Primary">
  <button data-tab="dashboard" onclick="go('dashboard')">Dashboard</button>
  <button data-tab="daily" onclick="go('daily')">Daily Accounting</button>
  <button data-tab="transactions" onclick="go('transactions')">Transactions</button>
  <button data-tab="income" onclick="go('income')">Income</button>
  <button data-tab="expenses" onclick="go('expenses')">Expenses</button>
  <button data-tab="accounts" onclick="go('accounts')">Accounts</button>
  <button data-tab="rules" onclick="go('rules')">Rules</button>
  <button data-tab="reports" onclick="go('reports')">Reports</button>
  <button data-tab="settings" onclick="go('settings')">Settings</button>
</nav>

<main class="page">
  <section id="view-dashboard"></section>
  <section id="view-daily" class="hidden"></section>
  <section id="view-transactions" class="hidden"></section>
  <section id="view-income" class="hidden"></section>
  <section id="view-expenses" class="hidden"></section>
  <section id="view-accounts" class="hidden"></section>
  <section id="view-rules" class="hidden"></section>
  <section id="view-reports" class="hidden"></section>
  <section id="view-settings" class="hidden"></section>
</main>

<nav id="mnav" aria-label="Primary">
  <button data-m="dashboard" onclick="go('dashboard')"><span class="ico">○</span>Home</button>
  <button data-m="daily" onclick="go('daily')"><span class="ico">◫</span>Daily</button>
  <button onclick="quickAdd()" class="mfab"><span class="ico">+</span>Add</button>
  <button data-m="transactions" onclick="go('transactions')"><span class="ico">≡</span>Ledger</button>
  <button onclick="openMore()"><span class="ico">⋯</span>More</button>
</nav>

<div id="modalWrap" class="hidden fixed inset-0 modal-bg sheet-modal"><div class="card modal-card" id="modalCard" role="dialog" aria-modal="true"></div></div>
<div id="toasts" aria-live="polite"></div>

<script src="app.js"></script>
</body>
</html>
